<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ruta Viva</title>
    <link rel="stylesheet" href="css/estilos.css">
    
</head>
<body>

    <header>
        <h1><a href="index.html" class="titulo-link">Ruta Viva</a></h1>
        <nav>
            <ul>
                <li><a href="rutas_turisticas.html">Rutas turísticas</a></li>
                <li><a href="sobre_ruta_viva.html">Sobre Ruta Viva</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="recomendaciones.html">Recomendaciones</a></li>
            </ul>
        </nav>
        <button class="btn-ingresar" onclick="location.href='login.html'">Ingresar</button>
    </header>

    <main class="login-container">
        <form class="login-card">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa a tu cuenta de turista para explorar las rutas de Ruta Viva.</p>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="usuario@rutaviva.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Ingresar a la plataforma</button>
            
            <a href="index.html" class="back-link">← Volver al inicio</a>
        </form>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
